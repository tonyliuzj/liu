    <textarea id="snippet-window-iframe" hidden>
function WindowIframe({ src, title, footer }) {
    const [isInteracting, setIsInteracting] = useState(false);
    const [reloadKey, setReloadKey] = useState(0);

    return (
        <Card className="bg-white/5 border-white/10 backdrop-blur-sm overflow-hidden">
            <div className="flex items-center gap-2 px-4 py-3 border-b border-white/10 bg-white/5">
                <div className="flex gap-1.5 shrink-0">
                    <span className="w-3 h-3 rounded-full bg-red-500/80" />
                    <span className="w-3 h-3 rounded-full bg-yellow-500/80" />
                    <span className="w-3 h-3 rounded-full bg-green-500/80" />
                </div>

                <div className="flex-1 min-w-0 ml-2 bg-black/25 rounded-md px-3 py-1 text-xs text-slate-500 font-mono text-center truncate">
                    {src}
                </div>

                <Button
                    type="button"
                    variant="ghost"
                    size="icon"
                    className="h-8 w-8 text-slate-400 hover:text-white hover:bg-white/10"
                    onClick={() => setReloadKey((key) => key + 1)}
                    aria-label={`Reload ${title}`}
                >
                    <RefreshCw className="w-4 h-4" />
                </Button>

                <Button
                    asChild
                    variant="ghost"
                    size="icon"
                    className="h-8 w-8 text-slate-400 hover:text-white hover:bg-white/10"
                    aria-label={`Open ${title}`}
                >
                    <a href={src} target="_blank" rel="noopener noreferrer">
                        <ExternalLink className="w-4 h-4" />
                    </a>
                </Button>
            </div>

            <CardContent className="p-0">
                <div
                    className="relative w-full h-[60vh] md:h-[80vh] bg-black/30"
                    onMouseLeave={() => setIsInteracting(false)}
                >
                    <button
                        type="button"
                        className={`absolute inset-0 z-10 flex flex-col items-center justify-center gap-3 bg-black/45 backdrop-blur-[2px] transition-all duration-300 ${
                            isInteracting
                                ? 'opacity-0 pointer-events-none'
                                : 'opacity-100 hover:bg-black/35'
                        }`}
                        onClick={() => setIsInteracting(true)}
                    >
                        <span className="inline-flex items-center gap-2 rounded-md border border-white/10 bg-white/10 px-4 py-2 text-sm font-medium text-white">
                            <MousePointer2 className="w-4 h-4" />
                            Click to interact
                        </span>
                    </button>

                    <iframe
                        key={reloadKey}
                        src={src}
                        title={title}
                        className={`w-full h-full border-0 transition-opacity duration-300 ${
                            isInteracting
                                ? 'pointer-events-auto opacity-100'
                                : 'pointer-events-none opacity-45'
                        }`}
                        sandbox="allow-forms allow-same-origin allow-scripts"
                    />
                </div>
            </CardContent>

            {footer && (
                <CardFooter className="py-2 px-4 bg-white/5 border-t border-white/10 flex justify-end">
                    {footer}
                </CardFooter>
            )}
        </Card>
    );
}

    <textarea id="snippet-terminal-state" hidden>
<script>
const input = document.getElementById('cmd-input');
const output = document.getElementById('output');
const terminalBody = document.getElementById('terminal-body');
const terminalWindow = document.querySelector('.terminal-window');
const promptElement = document.getElementById('prompt');
const screenPath = document.getElementById('screen-path');

const homeDirectory = '/home/visitor';
let currentDirectory = homeDirectory;
let history = [];
let historyIndex = 0;

function compactPath(path) {
  if (path === homeDirectory) return '~';
  if (path.startsWith(`${homeDirectory}/`)) return `~${path.slice(homeDirectory.length)}`;
  return path;
}

function updatePrompt() {
  const label = `visitor@nameserver ${compactPath(currentDirectory)} %`;
  promptElement.textContent = label;
  if (screenPath) screenPath.textContent = compactPath(currentDirectory);
}

function scrollToBottom() {
  terminalBody.scrollTop = terminalBody.scrollHeight;
}
</script>

    <textarea id="snippet-terminal-window" hidden>
<script>
function setTerminalFullscreen(isFullscreen) {
  terminalWindow.classList.remove('is-closed', 'is-minimized');
  terminalWindow.classList.toggle('is-fullscreen', isFullscreen);
  document.body.classList.toggle('terminal-fullscreen-open', isFullscreen);
  scrollToBottom();
}

function restoreTerminal() {
  terminalWindow.classList.remove('is-closed', 'is-minimized', 'is-fullscreen');
  document.body.classList.remove('terminal-fullscreen-open');
  input.focus();
}

function toggleTerminalMinimized() {
  const minimized = !terminalWindow.classList.contains('is-minimized');
  terminalWindow.classList.remove('is-closed', 'is-fullscreen');
  terminalWindow.classList.toggle('is-minimized', minimized);
  document.body.classList.remove('terminal-fullscreen-open');
}

function closeTerminalWindow() {
  terminalWindow.classList.remove('is-fullscreen', 'is-minimized');
  terminalWindow.classList.add('is-closed');
  document.body.classList.remove('terminal-fullscreen-open');
}

document.querySelectorAll('[data-window-action]').forEach((button) => {
  button.addEventListener('click', () => {
    const action = button.dataset.windowAction;

    if (action === 'fullscreen') setTerminalFullscreen(!terminalWindow.classList.contains('is-fullscreen'));
    if (action === 'minimize') toggleTerminalMinimized();
    if (action === 'close') closeTerminalWindow();
    if (action === 'wake' || action === 'restore') restoreTerminal();
  });
});
</script>
    </textarea>

    <textarea id="snippet-terminal-commands" hidden>
<script>
function appendLine(text = '', className = '') {
  const line = document.createElement('div');
  line.className = className ? `terminal-line ${className}` : 'terminal-line';
  line.textContent = text;
  output.appendChild(line);
  scrollToBottom();
}

function echoCommand(command) {
  const line = document.createElement('div');
  line.className = 'terminal-line echo system';

  const prompt = document.createElement('span');
  prompt.className = 'prompt';
  prompt.textContent = promptElement.textContent;

  const text = document.createElement('span');
  text.textContent = command;

  line.append(prompt, text);
  output.appendChild(line);
}

const commands = {
  help: [
    'Available commands:',
    '  help       Show commands',
    '  clear      Clear terminal',
    '  status     Show system status',
    '  records    List DNS record types'
  ],
  status: [
    'Shell Status',
    'Host: nameserver',
    'User: visitor',
    'Live DNS: enabled',
    'Window controls: active'
  ],
  records: [
    'A      IPv4 address',
    'AAAA   IPv6 address',
    'CNAME  Alias record',
    'MX     Mail exchanger',
    'NS     Nameserver',
    'SOA    Start of authority',
    'TXT    Text record'
  ]
};

function runCommand(rawCommand) {
  const command = rawCommand.trim();
  if (!command) return;

  echoCommand(command);
  history.push(command);
  historyIndex = history.length;

  if (command === 'clear') {
    output.innerHTML = '';
    return;
  }

  const result = commands[command];

  if (!result) {
    appendLine(`nameserver-sh: command not found: ${command}`, 'error');
    appendLine('Try: help', 'dim');
    appendLine();
    return;
  }

  result.forEach((line, index) => {
    appendLine(line, index === 0 ? 'accent' : '');
  });

  appendLine();
}
</script>
    </textarea>

    <textarea id="snippet-terminal-keyboard" hidden>
<script>
input.addEventListener('keydown', (event) => {
  if (event.key === 'Enter') {
    const command = input.value;
    input.value = '';
    runCommand(command);
  }

  if (event.key === 'ArrowUp') {
    event.preventDefault();
    if (historyIndex > 0) {
      historyIndex -= 1;
      input.value = history[historyIndex];
    }
  }

  if (event.key === 'ArrowDown') {
    event.preventDefault();
    if (historyIndex < history.length - 1) {
      historyIndex += 1;
      input.value = history[historyIndex];
    } else {
      historyIndex = history.length;
      input.value = '';
    }
  }

  if (event.ctrlKey && event.key.toLowerCase() === 'l') {
    event.preventDefault();
    output.innerHTML = '';
  }
});

document.querySelectorAll('[data-command]').forEach((button) => {
  button.addEventListener('click', () => {
    restoreTerminal();
    runCommand(button.dataset.command);
  });
});

terminalBody.addEventListener('click', () => input.focus());

updatePrompt();
</script>
